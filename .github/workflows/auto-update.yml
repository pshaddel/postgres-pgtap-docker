name: Auto Update PostgreSQL Versions

on:
  schedule:
    # Run one a monthly at 2:00 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-postgres-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use PAT if GITHUB_TOKEN doesn't have sufficient permissions
          # token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Check for new PostgreSQL versions
        id: check
        run: |
          TAGS=$(curl -s "https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100" | jq -r '.results[].name')

          LATEST_19=$(echo "$TAGS" | grep -E '^19beta[0-9]+$' | sort -V | tail -1)
          LATEST_18=$(echo "$TAGS" | grep -E '^18\.[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          LATEST_17=$(echo "$TAGS" | grep -E '^17\.[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)

          # Get current values from build script (first tag in each entry = the FROM image)
          CURRENT_19=$(grep -o '\["19"\]="[^"]*"' build-all-versions.sh | grep -o '"[^"]*"$' | tr -d '"' | awk '{print $1}')
          CURRENT_18=$(grep -o '\["18"\]="[^"]*"' build-all-versions.sh | grep -o '"[^"]*"$' | tr -d '"' | awk '{print $1}')
          CURRENT_17=$(grep -o '\["17"\]="[^"]*"' build-all-versions.sh | grep -o '"[^"]*"$' | tr -d '"' | awk '{print $1}')

          echo "Latest PG19: $LATEST_19  Current: $CURRENT_19"
          echo "Latest PG18: $LATEST_18  Current: $CURRENT_18"
          echo "Latest PG17: $LATEST_17  Current: $CURRENT_17"

          NEEDS_UPDATE=false

          if [ -n "$LATEST_19" ] && [ "$LATEST_19" != "$CURRENT_19" ]; then
            echo "postgres_19_update=true" >> $GITHUB_OUTPUT
            echo "new_version_19=$LATEST_19" >> $GITHUB_OUTPUT
            NEEDS_UPDATE=true
          else
            echo "postgres_19_update=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$LATEST_18" ] && [ "$LATEST_18" != "$CURRENT_18" ]; then
            echo "postgres_18_update=true" >> $GITHUB_OUTPUT
            echo "new_version_18=$LATEST_18" >> $GITHUB_OUTPUT
            NEEDS_UPDATE=true
          else
            echo "postgres_18_update=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$LATEST_17" ] && [ "$LATEST_17" != "$CURRENT_17" ]; then
            echo "postgres_17_update=true" >> $GITHUB_OUTPUT
            echo "new_version_17=$LATEST_17" >> $GITHUB_OUTPUT
            NEEDS_UPDATE=true
          else
            echo "postgres_17_update=false" >> $GITHUB_OUTPUT
          fi

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT

      - name: Update build script
        if: steps.check.outputs.needs_update == 'true'
        run: |
          # Update PostgreSQL 19 beta version if needed
          if [ "${{ steps.check.outputs.postgres_19_update }}" = "true" ]; then
            NEW_VERSION_19="${{ steps.check.outputs.new_version_19 }}"
            sed -i "s/\[\"19\"\]=\"[^\"]*\"/[\"19\"]=\"$NEW_VERSION_19 ${NEW_VERSION_19}-trixie ${NEW_VERSION_19}-bookworm\"/" build-all-versions.sh
          fi

          # Update PostgreSQL 18 version if needed
          if [ "${{ steps.check.outputs.postgres_18_update }}" = "true" ]; then
            NEW_VERSION_18="${{ steps.check.outputs.new_version_18 }}"
            sed -i "s/\[\"18\"\]=\"[^\"]*\"/[\"18\"]=\"$NEW_VERSION_18 18 latest ${NEW_VERSION_18}-trixie 18-trixie trixie ${NEW_VERSION_18}-bookworm 18-bookworm bookworm \"/" build-all-versions.sh
          fi

          # Update PostgreSQL 17 version if needed
          if [ "${{ steps.check.outputs.postgres_17_update }}" = "true" ]; then
            NEW_VERSION_17="${{ steps.check.outputs.new_version_17 }}"
            sed -i "s/\[\"17\"\]=\"[^\"]*\"/[\"17\"]=\"$NEW_VERSION_17 17 ${NEW_VERSION_17}-trixie 17-trixie ${NEW_VERSION_17}-bookworm 17-bookworm\"/" build-all-versions.sh
          fi

      - name: Check if images need building
        id: check_images
        run: |
          # Log in to Docker Hub to access the registry
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # Source build-all-versions.sh only to load POSTGRES_VERSIONS.
          # Safe because the main build loop is guarded behind BASH_SOURCE.
          source build-all-versions.sh

          needs_building=false
          for version in "${!POSTGRES_VERSIONS[@]}"; do
              for tag in ${POSTGRES_VERSIONS[$version]}; do
                  if ! docker manifest inspect "pshaddel/postgres-pgtap:$tag" >/dev/null 2>&1; then
                      echo "Missing tag: $tag — build needed"
                      needs_building=true
                      break 2
                  fi
              done
          done

          if [ "$needs_building" = false ]; then
              echo "All images already exist, no building needed"
          fi

          echo "needs_building=$needs_building" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check_images.outputs.needs_building == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_images.outputs.needs_building == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform images
        if: steps.check_images.outputs.needs_building == 'true'
        run: |
          # Make build script executable and run it
          chmod +x build-all-versions.sh
          ./build-all-versions.sh

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          # Use PAT if GITHUB_TOKEN doesn't have sufficient permissions
          # token: ${{ secrets.PAT_TOKEN }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update PostgreSQL versions"
          title: "Auto-update PostgreSQL versions"
          body: |
            This PR automatically updates PostgreSQL versions to the latest available.

            Updates:
            ${{ steps.check.outputs.postgres_19_update == 'true' && format('- Updated PostgreSQL 19 to {0}', steps.check.outputs.new_version_19) || '' }}
            ${{ steps.check.outputs.postgres_18_update == 'true' && format('- Updated PostgreSQL 18 to {0}', steps.check.outputs.new_version_18) || '' }}
            ${{ steps.check.outputs.postgres_17_update == 'true' && format('- Updated PostgreSQL 17 to {0}', steps.check.outputs.new_version_17) || '' }}

            Build status:
            ${{ steps.check_images.outputs.needs_building == 'true' && '- Docker images were rebuilt and pushed' || '- No image rebuilding was needed (all images already exist)' }}

            The build script handles:
            - Multi-platform builds (linux/arm/v7, linux/arm64/v8, linux/amd64)
            - PostgreSQL 18 special handling (copying pgTAP from PG17)
            - All variant tags (bookworm, trixie)
            - Skipping builds for images that already exist
          branch: auto-update-postgres-versions
